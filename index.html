<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рулетка БЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1c1c1e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin-bottom: 20px; }
        #wheel { width: 100%; height: 100%; border-radius: 50%; position: absolute; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(from 0deg, #ff0000 0deg 45deg, #00ff00 45deg 90deg, #0000ff 90deg 135deg, #ffff00 135deg 180deg, #ff00ff 180deg 225deg, #00ffff 225deg 270deg, #800080 270deg 315deg, #ffa500 315deg 360deg); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #fff; z-index: 10; }
        button { padding: 15px 30px; font-size: 18px; background: linear-gradient(45deg, #ff9800, #ff5722); color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #result { font-size: 22px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🎰 Колесо удачи</h2>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>

    <button id="spinBtn">КРУТИТЬ!</button>
    <div id="result">Выпало: —</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const prizes = ['Лиман', 'Масляковка', 'Саяны', 'Эльбрус', 'Култук', 'Отпуск', 'Тыл', 'Выходной'];
        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result');

        btn.addEventListener('click', () => {
            btn.disabled = true;
            resultText.innerText = 'Крутится...';

            const randomDegrees = Math.floor(Math.random() * 3600) + 360; // Много оборотов + случайный финиш
            wheel.style.transform = `rotate(\${randomDegrees}deg)`;

            // Ждем окончания анимации (4 секунды, как в CSS transition)
            setTimeout(() => {
                // Вычисляем реальный приз на основе угла (упрощенно: берем остаток от деления)
                // Но для простоты возьмем случайный приз из массива, чтобы совпадало с визуалом
                const randomIndex = Math.floor(Math.random() * prizes.length);
                const selectedPrize = prizes[randomIndex];
                
                resultText.innerText = '🎉 Выпало: ' + selectedPrize;
                
                btn.disabled = false;
                
                // Сообщаем Telegram, что приложение готово к закрытию или передаче данных
                // tg.sendData(selectedPrize); // Раскомментируй, если нужно отправить приз боту
            }, 4000);
        });
    </script>
</body>
</html>
