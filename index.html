<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка БЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h2 {
            margin: 0 0 15px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 20px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 30px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
        }

        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <h2>🎰 Колесо удачи</h2>

    <div class="wheel-container">
        <div class="pointer"></div>
        <svg id="wheel" viewBox="0 0 200 200"></svg>
    </div>

    <button id="spinBtn">КРУТИТЬ!</button>
    <div id="result">Жми кнопку!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const prizes = ['Лиман', 'Масляковка', 'Саяны', 'Эльбрус', 'Култук', 'Отпуск', 'Тыл', 'Выходной'];
        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#a55eea', '#70a1ff', '#2f3542', '#f1c40f'];

        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        const resultText = document.getElementById('result');

        // --- Строим SVG-сектора с подписями ---
        const cx = 100, cy = 100, r = 98;
        const sectorAngle = 360 / prizes.length;

        prizes.forEach((prize, i) => {
            const startDeg = i * sectorAngle - 90; // -90° ставит первый сектор наверх
            const endDeg = (i + 1) * sectorAngle - 90;

            const startRad = startDeg * Math.PI / 180;
            const endRad = endDeg * Math.PI / 180;

            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy + r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy + r * Math.sin(endRad);

            const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;
            const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pathEl.setAttribute('d', path);
            pathEl.setAttribute('fill', colors[i]);
            pathEl.setAttribute('stroke', '#fff');
            pathEl.setAttribute('stroke-width', '1');
            wheel.appendChild(pathEl);

            // Подпись
            const midDeg = startDeg + sectorAngle / 2;
            const midRad = midDeg * Math.PI / 180;
            const tx = cx + r * 0.6 * Math.cos(midRad);
            const ty = cy + r * 0.6 * Math.sin(midRad);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', tx);
            text.setAttribute('y', ty);
            text.setAttribute('fill', '#fff');
            text.setAttribute('font-size', '8');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            // Разворот подписи вдоль радиуса
            text.setAttribute('transform', `rotate(${midDeg + 90} ${tx} ${ty})`);
            text.textContent = prize;
            wheel.appendChild(text);
        });

        // --- Логика вращения ---
        let currentRotation = 0;

        btn.addEventListener('click', () => {
            btn.disabled = true;
            resultText.innerText = 'Колесо крутится...';
            resultText.style.color = '#aaa';

            // Выбираем приз
            const randomIndex = Math.floor(Math.random() * prizes.length);

            // Угол, на который нужно довернуть колесо,
            // чтобы выбранный сектор встал под указатель (сверху, 0°).
            // Центр сектора i находится на i * sectorAngle от верхней точки.
            // Чтобы загнать его наверх — повернуть на (360 - i * sectorAngle).
            const targetMod = (360 - randomIndex * sectorAngle) % 360;

            // Нормализуем текущий поворот к [0, 360)
            const currentMod = currentRotation % 360;

            // Разница, которую нужно добавить
            let delta = targetMod - currentMod;
            if (delta <= 0) delta += 360;

            // Добавляем минимум 3 полных оборота для красоты
            delta += 360 * 3;

            currentRotation += delta;

            wheel.style.transform = 'rotate(' + currentRotation + 'deg)';

            setTimeout(() => {
                resultText.innerText = '🎉 Выпало: ' + prizes[randomIndex];
                resultText.style.color = '#ffd700';
                btn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
